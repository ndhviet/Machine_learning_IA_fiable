format:
  html:
    theme: flatly
    css: assets/custom.css
    include-after-body: [assets/loading.html, assets/footer.html]
    toc: true
    toc-location: right
    toc-title: "Sur cette page"
    smooth-scroll: true
    code-fold: true
    code-copy: true
    code-overflow: wrap
    #code-block-bg: true
    #code-block-border-left: "#2563EB"
    fontsize: 1.05em
    grid:
      body-width: 900px
      sidebar-width: 250px
    embed-resources: false